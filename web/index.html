<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Platform</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app">
        <header class="app-header">
            <div class="wordmark">
                <span class="wordmark__glyph" aria-hidden="true">&#9822;</span>
                <span class="wordmark__text">Chess Platform</span>
            </div>
            <div class="header-right">
                <span id="whoami" class="whoami" hidden></span>
                <div id="connection-status" class="status status--disconnected">Desconectado</div>
            </div>
        </header>

        <!-- Pantalla de login / registro -->
        <section id="auth-screen" class="screen screen--centered">
            <div class="ambient-glow" aria-hidden="true"></div>
            <div class="card card--auth">
                <h2 class="card__title">Entrar</h2>
                <form id="auth-form">
                    <label class="field">
                        <span class="field__label">Usuario</span>
                        <input type="text" id="auth-username" required autocomplete="username">
                    </label>
                    <label class="field">
                        <span class="field__label">Contraseña</span>
                        <input type="password" id="auth-password" required autocomplete="current-password">
                        <span class="field__hint">Mínimo 8 caracteres</span>
                    </label>
                    <div class="auth-buttons">
                        <button type="submit" id="login-btn" class="btn btn--primary">Entrar</button>
                        <button type="button" id="register-btn" class="btn btn--ghost">Crear cuenta</button>
                    </div>
                </form>
                <p id="auth-error" class="error-text" role="alert"></p>
            </div>
        </section>

        <!-- Pantalla de lobby / matchmaking -->
        <section id="lobby-screen" class="screen screen--centered" hidden>
            <div class="card card--lobby">
                <h2 class="card__title">Buscar partida</h2>
                <label class="field">
                    <span class="field__label">Control de tiempo</span>
                    <select id="time-control-select">
                        <option value="BULLET">Bullet — 1+0</option>
                        <option value="BLITZ" selected>Blitz — 5+3</option>
                        <option value="RAPID">Rápidas — 10+5</option>
                        <option value="CLASSICAL">Clásicas — 30+20</option>
                    </select>
                </label>
                <button id="find-match-btn" class="btn btn--primary btn--block">Buscar partida</button>
                <p id="matchmaking-status" class="status-text"></p>
                <div class="lobby-links">
                    <button id="profile-btn" class="btn btn--link">Mi perfil</button>
                    <button id="leaderboard-btn" class="btn btn--link">Ranking</button>
                    <button id="history-btn" class="btn btn--link">Historial</button>
                    <button id="logout-btn" class="btn btn--link">Cerrar sesión</button>
                </div>
            </div>
        </section>

        <!-- Pantalla de perfil -->
        <section id="profile-screen" class="screen screen--centered" hidden>
            <div class="card card--auth">
                <h2 class="card__title">Mi perfil</h2>
                <p id="profile-username" class="profile-username"></p>
                <div class="profile-rating">
                    <span id="profile-rating-value" class="profile-rating__value">—</span>
                    <span class="profile-rating__label">rating</span>
                </div>
                <div class="stat-grid">
                    <div class="stat-grid__item">
                        <span id="profile-games" class="stat-grid__value">—</span>
                        <span class="stat-grid__label">Partidas</span>
                    </div>
                    <div class="stat-grid__item stat-grid__item--win">
                        <span id="profile-wins" class="stat-grid__value">—</span>
                        <span class="stat-grid__label">Ganadas</span>
                    </div>
                    <div class="stat-grid__item stat-grid__item--loss">
                        <span id="profile-losses" class="stat-grid__value">—</span>
                        <span class="stat-grid__label">Perdidas</span>
                    </div>
                    <div class="stat-grid__item">
                        <span id="profile-draws" class="stat-grid__value">—</span>
                        <span class="stat-grid__label">Tablas</span>
                    </div>
                </div>
                <p id="profile-checkmate-wins" class="profile-checkmate-wins" hidden></p>
                <button id="profile-back-btn" class="btn btn--ghost btn--block">Volver</button>
            </div>
        </section>

        <!-- Pantalla de ranking -->
        <section id="leaderboard-screen" class="screen screen--centered" hidden>
            <div class="card card--wide">
                <h2 class="card__title">Ranking</h2>
                <div class="scoresheet-wrap scoresheet-wrap--tall">
                    <table class="scoresheet standings">
                        <thead>
                            <tr>
                                <th class="scoresheet__num-col">#</th>
                                <th>Jugador</th>
                                <th>Rating</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-list"></tbody>
                    </table>
                </div>
                <button id="leaderboard-back-btn" class="btn btn--ghost btn--block">Volver</button>
            </div>
        </section>

        <!-- Pantalla de partida -->
        <section id="game-screen" class="screen" hidden>
            <main class="table">
                <div id="board" class="board"></div>

                <aside class="sidebar">
                    <div class="clock">
                        <div id="clock-row-black" class="clock__row">
                            <span id="player-name-black" class="clock__name">Negras</span>
                            <div id="clock-black" class="clock__player">--:--</div>
                        </div>
                        <div id="clock-row-white" class="clock__row">
                            <span id="player-name-white" class="clock__name">Blancas</span>
                            <div id="clock-white" class="clock__player">--:--</div>
                        </div>
                    </div>
                    <div id="turn-indicator" class="turn-indicator"></div>
                    <p id="game-message" class="game-message" role="status"></p>

                    <div id="draw-offer-banner" class="draw-offer-banner" hidden>
                        <p id="draw-offer-text"></p>
                        <div class="draw-offer-banner__actions">
                            <button id="draw-accept-btn" class="btn btn--primary">Aceptar</button>
                            <button id="draw-decline-btn" class="btn btn--ghost">Rechazar</button>
                        </div>
                    </div>

                    <div class="scoresheet-wrap">
                        <table class="scoresheet">
                            <thead>
                                <tr>
                                    <th class="scoresheet__num-col">#</th>
                                    <th>Blancas</th>
                                    <th>Negras</th>
                                </tr>
                            </thead>
                            <tbody id="move-list"></tbody>
                        </table>
                    </div>

                    <div class="controls">
                        <button id="offer-draw-btn" class="btn btn--ghost btn--block">Ofrecer tablas</button>
                        <button id="resign-btn" class="btn btn--danger btn--block">Rendirse</button>
                    </div>
                </aside>
            </main>
        </section>

        <!-- Modal de fin de partida — cubre toda la pantalla, con fondo desenfocado -->
        <div id="game-over-modal" class="modal-overlay" hidden>
            <div class="modal-overlay__backdrop"></div>
            <div id="game-over-card" class="modal-card">
                <h2 id="game-over-title" class="modal-card__title"></h2>
                <p id="game-over-subtitle" class="modal-card__subtitle"></p>
                <span id="game-over-rating-change" class="rating-change modal-card__rating" hidden></span>
                <button id="modal-back-to-lobby-btn" class="btn btn--primary btn--block">Volver al menú</button>
            </div>
        </div>

        <!-- Pantalla de historial de partidas -->
        <section id="history-screen" class="screen screen--centered" hidden>
            <div class="card card--wide">
                <h2 class="card__title">Historial de partidas</h2>
                <div id="history-list" class="history-list"></div>
                <button id="history-back-btn" class="btn btn--ghost">Volver</button>
            </div>
        </section>

        <!-- Pantalla de reproducción de una partida -->
        <section id="replay-screen" class="screen" hidden>
            <main class="table">
                <div id="replay-board" class="board"></div>

                <aside class="sidebar">
                    <p id="replay-info" class="replay-info"></p>
                    <p id="replay-move-counter" class="turn-indicator"></p>

                    <div class="scoresheet-wrap">
                        <table class="scoresheet">
                            <thead>
                                <tr>
                                    <th class="scoresheet__num-col">#</th>
                                    <th>Blancas</th>
                                    <th>Negras</th>
                                </tr>
                            </thead>
                            <tbody id="replay-move-list"></tbody>
                        </table>
                    </div>

                    <div class="controls controls--split">
                        <button id="replay-prev-btn" class="btn btn--ghost">&#9664; Anterior</button>
                        <button id="replay-next-btn" class="btn btn--ghost">Siguiente &#9654;</button>
                    </div>
                    <button id="replay-back-btn" class="btn btn--link">Volver al historial</button>
                </aside>
            </main>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/board.js"></script>
    <script src="js/history.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/websocket-client.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
