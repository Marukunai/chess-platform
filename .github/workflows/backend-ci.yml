name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Compilar y testear
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # verify (no solo test) para que el pipeline también atrape errores de
      # empaquetado, no solo de tests — compila, corre los 100+ tests y empaqueta.
      - name: Compilar, testear y empaquetar
        run: mvn --batch-mode --no-transfer-progress verify

  docker-build:
    name: Verificar que la imagen Docker construye
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir la imagen del backend (sin publicarla)
        run: docker build -t chess-platform-backend:ci ./backend